name: starknet_arcade_mobile
description: Mobile app for Starknet Arcade using Starknet.dart
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  starknet: ^0.2.0   # Starknet.dart package
  flutter_secure_storage: ^8.0.0
  flutter_riverpod: ^2.3.6
  dio: ^5.0.0
  url_launcher: ^6.1.11
  shared_preferences: ^2.2.0
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1
  flutter_svg: ^2.0.5
  carousel_slider: ^4.2.1
  animated_text_kit: ^4.2.2
  flutter_animate: ^4.1.1
  lottie: ^2.4.0
  google_fonts: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/ 